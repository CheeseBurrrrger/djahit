<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Djahit - Reward Points</title>
    <link rel="icon" type="image/x-icon" href="../ASSETS/img/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cream': '#E9E4D4',
                        'section-white': '#F4F2E9',
                        'djahit-orange': '#E07A5F',
                        'text-dark': '#A85C47',
                        'button-green': '#7A8568',
                        'sage-green': '#8B9D6F',
                        'text-white': '#F6F7F3',
                        'text-radio': '#393E30',
                        'reminder': '#F5D6CD',
                        'font-sec': '#414141',
                        'table':'#E2E7DB'
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cream font-sans">
    <div id="navbar-container"></div>
    <main class="max-w-7xl mx-auto px-6 pb-8 pt-16">
        <div class="h-[250px] bg-section-white rounded-2xl py-8 px-16 mb-8">
            <h2 class="text-base font-medium text-button-green mb-6 border-b border-[#A3B18A] pb-2">Informasi Akun</h2>
            <div class="flex items-start justify-between">
                <div class="flex items-start space-x-24 pl-20">
                    <div class="relative">
                        <div class="w-[90px] h-[100px] rounded-2xl bg-transparent border border-button-green from-button-green to-sage-green flex items-center justify-center overflow-hidden">
                            <img src="../assets/img/syaqina.svg" alt="profile picture ilustrasi">
                        </div>
                        <button class="absolute flex items-center justify-center -bottom-10 left-1/2 transform -translate-x-1/2 bg-[#CA6E56] bg-opacity-80 text-white text-xs py-1 rounded-3xl w-[130px] h-[30px] hover:bg-opacity-100 transition-colors">
                            <img src="../assets/img/buttonUbah.svg" alt="">
                            Ubah Foto Profil
                        </button>
                    </div>                    
                    <div class="grid grid-cols-2 gap-x-24 gap-y-[17px]">
                        <div>
                            <p class="text-xs text-text-dark mb-1">Nama Depan</p>
                            <p class="font-medium text-base text-text-radio">Zaghrata</p>
                        </div>
                        <div>
                            <p class="text-xs text-text-dark mb-1">Nama Belakang</p>
                            <p class="font-medium text-base text-text-radio">Namira</p>
                        </div>
                        <div>
                            <p class="text-xs text-text-dark mb-1">Email Address</p>
                            <p class="font-medium text-base text-text-radio">Zagh@gmail.com</p>
                        </div>
                        <div>
                            <p class="text-xs text-text-dark mb-1">Phone Number</p>
                            <p class="font-medium text-base text-text-radio">(+62)082237182</p>
                        </div>
                    </div>
                </div>                
                <div class="text-center pr-16">
                    <p class="text-sm text-gray-500 mb-2">Poin Reward</p>
                    <div class="text-xl font-bold text-djahit-orange mb-4">240*</div>
                    <button class="bg-djahit-orange text-base text-white w-[176px] h-[36px] px-6 rounded-lg hover:bg-opacity-90 transition-colors font-medium">
                        Redeem Reward
                    </button>
                </div>
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-section-white rounded-2xl pt-7 pl-6 pr-14 pb-6">
                <h3 class="text-base font-medium text-[#A3B18A] mb-4 border-b border-[#A3B18A] pb-2">Riwayat Order</h3>
                <div class>
                    <div class="flex items-center justify-between h-[40px] py-4 pl-4 pr-3 bg-table rounded-t-2xl">
                        <div>
                            <span class="text-gray-600 text-base mr-2">1.</span>
                            <span class="font-medium text-base text-gray-900">Denim Coklat</span>
                        </div>
                        <button class="text-djahit-orange font-medium hover:underline flex items-center">
                            Detail
                            <img src="../assets/img/right.svg" class="pl-2" alt="arrow to the right">
                        </button>
                    </div>
                    <div class="flex items-center justify-between h-[40px] py-4 pl-4 pr-3 bg-transparent">
                        <div>
                            <span class="text-gray-600 text-base mr-2">2.</span>
                            <span class="font-medium text-base text-gray-900">Sarung Santri</span>
                        </div>
                        <button class="text-djahit-orange font-medium hover:underline flex items-center">
                            Detail
                            <img src="../assets/img/right.svg" class="pl-2" alt="arrow to the right">
                        </button>
                    </div>
                    <div class="flex items-center justify-between h-[40px] py-4 pl-4 pr-3 bg-table rounded-b-2xl">
                        <div>
                            <span class="text-gray-600 text-base mr-2">3.</span>
                            <span class="font-medium text-base text-gray-900">Denim Coklat</span>
                        </div>
                        <button class="text-djahit-orange font-medium hover:underline flex items-center">
                            Detail
                            <img src="../assets/img/right.svg" class="pl-2" alt="arrow to the right">
                        </button>
                    </div>
                </div>
            </div>
            <div class="bg-section-white rounded-2xl pt-7 pl-6 pr-14 pb-6">
                <h3 class="text-base font-medium text-[#A3B18A] mb-4 border-b border-[#A3B18A] pb-2">Riwayat Kegiatan</h3>
                <div>
                    <div class="flex items-center justify-between h-[40px] py-4 pl-4 pr-6 bg-table rounded-t-2xl">
                        <div class>
                            <span class="text-gray-600 text-base mr-2">1.</span>
                            <span class="font-medium text-base text-gray-900">Donasi Baju</span>
                        </div>
                        <span class="text-djahit-orange text-base font-semibold">20 Pts</span>
                    </div>
                    <div class="flex items-center justify-between h-[40px] py-4 pl-4 pr-6 bg-transparent ">
                        <div>
                            <span class="text-gray-600 text-base mr-2">2.</span>
                            <span class="font-medium text-base text-gray-900">Perbaiki Baju</span>
                        </div>
                        <span class="text-djahit-orange text-base font-semibold">10 Pts</span>
                    </div>
                    <div class="flex items-center justify-between h-[40px] py-4 pl-4 pr-6 bg-table rounded-b-2xl">
                        <div>
                            <span class="text-gray-600 text-base mr-2">3.</span>
                            <span class="font-medium text-base text-gray-900">Ajak Mitra</span>
                        </div>
                        <span class="text-djahit-orange text-base font-semibold">50 Pts</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div id="footer-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            $('#navbar-container').load('navbar.html');
            $('#footer-container').load('footer.html');            
        });
    </script>
</body>
</html>
